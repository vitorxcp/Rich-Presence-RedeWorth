<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titleAPP">Carregando...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'League Spartan';
            font-style: normal;
            font-display: swap;
            font-weight: 400;
            src: url(./fonts/league-spartan/league-spartan_5.2.6_latin-400-normal.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: 'League Spartan';
            font-style: normal;
            font-display: swap;
            font-weight: 700;
            src: url(./fonts/league-spartan/league-spartan_5.2.6_latin-700-normal.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        * {
            margin: 0;
            color: #fafafa;
            font-family: 'League Spartan', sans-serif;
        }

        body {
            text-align: center;
            background-color: #0a0a0a;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            -webkit-app-region: drag;
        }

        div.wedfr {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            background: radial-gradient(ellipse at center, rgba(17, 24, 39, 0.5) 0%, rgba(10, 10, 10, 0.9) 100%);
            flex-direction: column;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) skewX(-20deg);
            }

            100% {
                transform: translateX(100%) skewX(-20deg);
            }
        }

        .animate-shimmer {
            animation: shimmer 2.5s ease-in-out infinite;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .animate-fade-in-fast {
            animation: fadeInUp 0.4s ease-out forwards;
            opacity: 0;
        }

        .animate-fade-in-fast2 {
            animation: fadeInUp 0.08s ease-out forwards;
            opacity: 0;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .success-icon {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .loader5 {
            height: 8px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 99px;
            overflow: hidden;
            border: none;
            margin-top: 0;
            position: relative;
        }

        .loader5::after {
            content: '';
            width: var(--after-size, 0px);
            height: 100%;
            background: linear-gradient(90deg, #007cf0, #00dfd8);
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
            transition: width 0.3s ease-out;
        }
    </style>
</head>

<body>
    <div class="wedfr">
        <div class="w-full p-8 rounded-2xl shadow-2xl
                    bg-gradient-to-br from-gray-900 to-[#060a0e]
                    ring-1 ring-white/10
                    flex flex-col items-center
                    animate-fade-in h-full w-full flex justify-center">

            <div style="background-image: url(./image/imageicon.png);background-repeat: no-repeat;width: 64px;height: 64px;border-radius: 5px;"
                class="relative overflow-hidden shadow-lg" alt="Logo">
                <div class="absolute bg-gradient-to-r from-transparent via-white to-transparent opacity-[0.2] animate-shimmer"
                    style="width: 200%;height: 150px;top: -43px;left: -50%;" aria-hidden="true">
                </div>
            </div>

            <div class="flex flex-col">
                <span id="title" class="block text-lg font-semibold text-gray-200 text-center mt-6"></span>
                <span id="title2" class="block text-lg font-semibold text-gray-200 text-center h-12"></span>
            </div>

            <div id="loader-container" class="h-10 w-full mt-4 flex items-center justify-center">

                <div id="loader-indeterminate" class="spinner"></div>

                <div id="loader-determinate" class="w-full hidden">
                    <div class="loader5" style="--after-size: 0%;"></div>
                </div>

                <div id="loader-success" class="hidden">
                    <svg class="w-10 h-10 text-green-500 success-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                    </svg>
                </div>

            </div>

        </div>
    </div>

    <script>
        try {
            var translations;

            const tr = translate();
            const { ipcRenderer, app } = require('electron');
            const titleEl = document.getElementById("title");
            const titleEl2 = document.getElementById("title2");
            const loaderContainer = document.getElementById("loader-container");
            const loaderIndeterminate = document.getElementById("loader-indeterminate");
            const loaderDeterminate = document.getElementById("loader-determinate");
            const loaderSuccess = document.getElementById("loader-success");
            const progressBar = loaderDeterminate.querySelector(".loader5");

            document.getElementById("titleAPP").innerText = tr["splash"]["title"];

            function showLoader(type) {
                loaderIndeterminate.classList.add('hidden');
                loaderDeterminate.classList.add('hidden');
                loaderSuccess.classList.add('hidden');

                if (type === 'indeterminate') {
                    loaderIndeterminate.classList.remove('hidden');
                } else if (type === 'determinate') {
                    loaderDeterminate.classList.remove('hidden');
                } else if (type === 'success') {
                    loaderSuccess.classList.remove('hidden');
                }
            }

            function updateTitle(text) {
                titleEl.classList.remove("animate-fade-in-fast");
                void titleEl.offsetWidth;
                titleEl.innerHTML = text;
                titleEl.classList.add("animate-fade-in-fast");
            }

            function updateTitle2(text) {
                titleEl2.classList.remove("animate-fade-in-fast2");
                void titleEl2.offsetWidth;
                titleEl2.innerHTML = text;
                titleEl2.classList.add("animate-fade-in-fast2");
            }

            setTimeout(() => {
                ipcRenderer.send(`updateVerify`, {});

                updateTitle(tr["splash"]["checkUpdates"]);
                showLoader('indeterminate');

                ipcRenderer.on("yepUpdate", (event, data) => {
                    updateTitle(tr["splash"]["updatePending"]);
                    showLoader('indeterminate');
                });

                ipcRenderer.on('firstUpdate', (event, data) => {
                    if (data === true) {
                        updateTitle(tr["splash"]["updateSucess"]);
                        showLoader('success');

                        setTimeout(() => {
                            updateTitle(tr["splash"]["startApp"]);
                            showLoader('indeterminate');
                            setTimeout(() => {
                                ipcRenderer.send(`firstUpdate`, {});
                            }, 500);
                        }, 30000);
                    } else {
                        updateTitle(tr["splash"]["noUp"]);
                        showLoader('indeterminate');
                        setTimeout(() => {
                            updateTitle(tr["splash"]["startApp"]);
                            setTimeout(() => {
                                ipcRenderer.send(`firstUpdate`, {});
                            }, 500);
                        }, 1000);
                    }
                });

                var ae, sdf = 0;

                ipcRenderer.on("outputPercentUpdate", (event, data) => {
                    if (ae === 0) {
                        ae = 1;
                        updateTitle(tr["splash"]["down"]);
                    }

                    updateTitle2(data + "%");
                    showLoader('determinate');
                    progressBar.style.setProperty('--after-size', `${data}%`);
                });

                ipcRenderer.on("outputPercentExtractedFiles", (event, data) => {
                    if (sdf === 0) {
                        sdf = 1;
                        updateTitle(tr["splash"]["extracting"]);

                    }

                    updateTitle2(data + "%");
                    showLoader('determinate');
                    progressBar.style.setProperty('--after-size', `${data}%`);
                });

            }, 1500);

            function getLanguage() {
                const languages = navigator.languages;
                const primaryLocale = navigator.language;
                const mainLang = primaryLocale.split('-')[0];

                return mainLang;
            }

            function translate() {
                const lang = getLanguage();
                const defaultLang = 'en';

                try {
                    translations = require(`../resources/languages/${lang}.json`);
                    console.warn("Linguagem de tradução aplicada: " + lang + ".")
                } catch (e1) {
                    translations = require(`../resources/languages/${defaultLang}.json`);
                    console.warn("Linguagem (" + lang + ") de tradução não encontrada, redirecionando sistema padrão para: " + defaultLang + ".")
                }

                return translations;
            }
        } catch (e) {
            console.error("Electron 'require' failed. Running in browser mode.", e);
            document.getElementById("title").innerHTML = "Erro: Este app deve ser rodado com Electron.";
        }
    </script>
</body>

</html>
